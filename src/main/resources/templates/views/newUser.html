<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>새로운 사용자 등록</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css"
          integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT"
          rel="stylesheet" crossorigin="anonymous">
</head>
<body>
    <h1>새로운 사용자 등록</h1>

    <form name="userfrm">
        <div>아이디 <input type="text" name="userid"></div>
        <div>비밀번호 <input type="password" name="passwd"></div>
        <div>비밀번호 확인 <input type="password" name="repasswd"></div>
        <div>이름 <input type="text" name="name"></div>
        <div>이메일 <input type="text" name="email"></div>

        <div><button type="button" id="newbtn">입력완료</button>
            <button type="reset">다시입력</button></div>
    </form>

    <hr>
    <div><a href="/api/getUsers">사용자 조회</a></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO"
            crossorigin="anonymous"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            document.querySelector('#newbtn').addEventListener('click', () => {
                let userid = document.querySelector('input[name=userid]');
                if (userid.value === '') { alert('아이디를 입력하세요!'); return false; }

                let passwd = document.querySelector('input[name=passwd]');
                if (passwd.value === '') { alert('비밀번호를 입력하세요!'); return false; }

                let repasswd = document.querySelector('input[name=repasswd]');
                if (repasswd.value === '') { alert('비밀번호 확인을 입력하세요!'); return false; }

                let name = document.querySelector('input[name=name]');
                if (name.value === '') { alert('이름을 입력하세요!'); return false; }

                let email = document.querySelector('input[name=email]');
                if (email.value === '') { alert('이메일을 입력하세요!'); return false; }

                let userfrm = document.querySelector('form[name=userfrm]');
                userfrm.method = 'post';
                userfrm.submit();
            });
        });
    </script>

</body>
</html>
